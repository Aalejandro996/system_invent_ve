# Blueprint de Render: crea solo el servicio web. La base PostgreSQL ya existente se conecta con DATABASE_URL.
services:
  - type: web
    name: sistema-ve-demo
    runtime: python
    # region: oregon       # debe coincidir con la región de su base de datos (si no, use la External URL)
    plan: free            # se "duerme" tras 15 min sin tráfico; "starter" lo evita
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL     # Render la pedirá al crear: pegue la "Internal Database URL" de su base existente
        sync: false
      - key: DB_SCHEMA        # esquema propio dentro de esa base, para no mezclarse con otros proyectos
        value: sistema_ve
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "1"
      - key: PASS_ADMIN
        generateValue: true
      - key: PASS_INVENTARIO
        generateValue: true
      - key: PASS_USUARIOS
        generateValue: true
      # - key: DEMO_SHOW_CREDS   # ponga "1" para mostrar los accesos en la pantalla de ingreso
      #   value: "1"