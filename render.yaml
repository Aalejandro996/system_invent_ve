# Blueprint de Render: crea la base PostgreSQL y el servicio web.
databases:
  - name: sistema-ve-db
    databaseName: sistema_ve
    user: sistema_ve
    plan: free            # la base gratuita expira a los 30 días; use "basic-256mb" para algo estable

services:
  - type: web
    name: sistema-ve-demo
    runtime: python
    plan: free            # se "duerme" tras 15 min sin tráfico; "starter" lo evita
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-ve-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "1"
      - key: PASS_ADMIN
        generateValue: true
      - key: PASS_INVENTARIO
        generateValue: true
      - key: PASS_USUARIOS
        generateValue: true
      # - key: DEMO_SHOW_CREDS   # ponga "1" para mostrar los accesos en la pantalla de ingreso
      #   value: "1"
